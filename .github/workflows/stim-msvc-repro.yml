name: stim MSVC repro

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/stim-msvc-repro.yml"]

jobs:
  build-stim:
    strategy:
      fail-fast: false
      matrix:
        os: ["windows-latest", "windows-2022"]
        variant:
          - name: "1.16.0 / source"
            args: '--no-binary stim "stim==1.16.0"'
          - name: "1.17 dev / source"
            args: '--prerelease=allow --no-binary stim "stim>=1.17.dev0,<1.18"'
          - name: "1.17 dev / wheel"
            args: '--prerelease=allow --only-binary stim "stim>=1.17.dev0,<1.18"'
    name: "${{ matrix.variant.name }} / ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Show Visual Studio / MSVC versions
        run: |
          VSWHERE="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          "$VSWHERE" -latest -property displayName
          "$VSWHERE" -latest -property catalog_productDisplayVersion
          ls "$("$VSWHERE" -latest -property installationPath)/VC/Tools/MSVC"

      - name: Install uv and Python 3.15
        run: |
          pip install uv
          uv python install 3.15
          uv venv --python 3.15

      - name: Install stim (${{ matrix.variant.name }})
        run: uv pip install -v ${{ matrix.variant.args }}

      - name: Check import
        run: .venv/Scripts/python.exe -c "import stim; print(stim.__version__, stim.__file__)"
